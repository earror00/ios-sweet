name: rootfs

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: full URL of the iPhone10,3 iOS 16.7.16 (20H392) IPSW
        default: "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
      size:
        description: HFS+ root image size
        default: "16G"

concurrency:
  group: rootfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q hfsprogs rsync android-sdk-libsparse-utils \
            libfuse3-dev libbz2-dev liblzfse-dev libutf8proc-dev cmake ninja-build
          git clone --recursive --depth 1 https://github.com/sgan81/apfs-fuse /tmp/apfs-fuse
          cmake -S /tmp/apfs-fuse -B /tmp/apfs-fuse/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/apfs-fuse/build -j
          sudo cp /tmp/apfs-fuse/build/apfs-fuse /usr/local/bin/
          # lzfse CLI: Apple recompresses older IPSWs on the CDN; the OS dmg
          # comes out as an lzfse stream ('bvxn' magic) and needs decompressing.
          git clone --depth 1 https://github.com/lzfse/lzfse /tmp/lzfse
          cmake -S /tmp/lzfse -B /tmp/lzfse/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/lzfse/build -j
          sudo cp /tmp/lzfse/build/lzfse /usr/local/bin/
          # ipsw tool: identifies the fs/sys/app dmgs via BuildManifest (a size
          # heuristic mispicks them). Pinned release, no API rate limits.
          curl -fsSL https://github.com/blacktop/ipsw/releases/download/v3.1.739/ipsw_3.1.739_linux_x86_64.tar.gz \
            | sudo tar xz -C /usr/local/bin ipsw
          ipsw version
          apfs-fuse -h 2>&1 | head -2 || true
          which mkfs.hfsplus fsck.hfsplus img2simg rsync lzfse

      - name: Download IPSW
        run: |
          curl -sfL -o ipsw.ipsw "${{ inputs.ipsw_url }}"
          ls -la ipsw.ipsw

      - name: Extract the three restore DMGs
        run: |
          for kind in fs sys app; do
            ipsw extract --dmg "$kind" -o "dmgs/$kind" ipsw.ipsw
            f=$(find "dmgs/$kind" -type f -name '*.dmg' | head -1)
            [ -n "$f" ] || { echo "no dmg extracted for $kind"; exit 1; }
            mv "$f" "dmgs/$kind.dmg"
            rm -rf "dmgs/$kind"
          done
          rm -f ipsw.ipsw
          cd dmgs
          head -c4 fs.dmg | grep -q bvxn && {
            echo "decompressing lzfse OS dmg..."
            lzfse -decode -i fs.dmg -o fs-raw.dmg
            mv fs-raw.dmg fs.dmg
          } || true
          # A koly trailer with an empty resource fork is Apple's "wrapped"
          # marker, not a UDIF: strip it so apfs-fuse reads raw APFS.
          size=$(stat -c%s fs.dmg)
          [ "$(tail -c4 fs.dmg | xxd -p)" = "6b6f6c79" ] && {
            rsrc_len=$(python3 -c "import struct; f = open('fs.dmg','rb'); f.seek($size - 512); print(struct.unpack_from('>Q', f.read(512), 0x30)[0])")
            [ "$rsrc_len" = "0" ] && { truncate -s $((size - 512)) fs.dmg; echo "stripped koly trailer"; }
          } || true
          for f in fs.dmg sys.dmg app.dmg; do
            printf '%s: ' "$f"; head -c4 "$f" | xxd -p
          done
          # Every image must be a raw APFS container now (checksum + NXSB@0x20).
          for f in fs.dmg sys.dmg app.dmg; do
            [ "$(head -c4 "$f" | xxd -p)" = "85216704" ] || { echo "$f: not raw APFS"; exit 1; }
          done
          cd ..
          ls -la dmgs/

      - name: Build the HFS+ root
        run: |
          df -h /
          tools/mkiosroot.sh dmgs/fs.dmg dmgs/sys.dmg dmgs/app.dmg ios16-root.img "${{ inputs.size }}"
          ls -la ios16-root.img

      - name: Apply bring-up tweaks
        run: |
          sudo fsck.hfsplus -fy ios16-root.img | tail -3 || true
          sudo mkdir -p /mnt/iosroot
          sudo mount -t hfsplus -o loop,force ios16-root.img /mnt/iosroot
          sudo python3 tools/sweet-root-tweaks.py /mnt/iosroot
          df -h /mnt/iosroot
          sudo umount /mnt/iosroot
          sudo fsck.hfsplus -fy ios16-root.img | tail -3 || true
          rm -f os.dmg sysos.dmg appos.dmg

      - name: Sparse image + checksum
        run: |
          img2simg ios16-root.img ios16-root.simg
          sha256sum ios16-root.img ios16-root.simg | tee SHA256SUMS
          ls -la ios16-root.simg
          df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: ios-root
          path: |
            ios16-root.simg
            SHA256SUMS
          retention-days: 7
